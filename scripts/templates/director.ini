[ DeepDesert_1 ]
; Director chooses instancingMode=Dimension for DD travel (per the
; Overland_to_DeepDesert1_S{1,2,3} sandstorm sequences), so it needs at
; least one extra partition slot it can allocate per traveling player —
; the warm partition is the shared post-sandstorm DD; the "extra" is
; the per-player tunnel. With NumExtraServers=0 Director rejected with
; TravelResponseCode.DestinationTemporarilyUnavailable (Code 17).
